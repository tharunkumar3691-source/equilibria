# Render Blueprint: deploys Equilibria as one Node web service (the built page, the API and the Gemini proxy).
# In Render: New > Blueprint, pick this repository, then fill in the secret values it asks for.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: equilibria
    runtime: node
    # Free plan: sleeps after 15 minutes idle (the first visit then takes about a minute), and credit balances
    # and PayPal orders reset whenever the instance restarts. For a paid instance (plan: starter), add a disk
    # (name, mountPath: /var/data, sizeGB: 1) and DATA_DIR=/var/data so they survive restarts.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Free credits for each new visitor, and how many new visitors per network a day get them
      # (generous so several judges on one office network can all try it)
      - key: FREE_CREDITS
        value: "5"
      - key: FREE_STARTS_PER_IP
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      # Backup key, used when the first runs out of quota (best from a second Google Cloud project)
      - key: GEMINI_API_KEY_2
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional: the id of a sandbox webhook pointing at https://<your-app>.onrender.com/api/paypal/webhook
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # A last guard on the Gemini bill: requests per day for the whole server
      - key: DAILY_GEMINI_CALL_CAP
        value: "3000"
