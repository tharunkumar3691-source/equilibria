<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equilibria · Physics, gently revealed</title>
    <meta name="description" content="Turn a video or a sentence into a calm, interactive 3D physics simulation." />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111819'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2386cbbf' stroke-width='1.6' opacity='.55'/%3E%3Cpath d='M5.5 19.5h21' stroke='%2386cbbf' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='15' r='4' fill='%23e8cc96'/%3E%3C/svg%3E" />
    <script>
      // This app has no service worker. One left behind by another project that used the same
      // localhost port would keep serving stale cached files (including an old API key), so remove it.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            if (!sessionStorage.getItem('swCleared')) {
              sessionStorage.setItem('swCleared', '1');
              location.reload();
            }
          });
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
